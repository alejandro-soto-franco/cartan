name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace (default features)
        run: cargo test --workspace
      - name: Test cartan-homog with all features
        run: cargo test -p cartan-homog --features full-field,stochastic
      - name: Test cartan-homog-valid with all features
        run: cargo test -p cartan-homog-valid --features full-field,stochastic
      - name: Clippy (default features, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The gpu-fft feature pulls gpufft's Vulkan backend, which needs GPU/Vulkan
      # system libraries a runner lacks, so CI lints the substantive features
      # without it (the GPU path needs real hardware to exercise anyway).
      - name: Clippy (cartan-homog full features, all targets)
        run: cargo clippy -p cartan-homog --all-targets --features full-field,stochastic -- -D warnings
      - name: Clippy (cartan-homog-valid full features, all targets)
        run: cargo clippy -p cartan-homog-valid --all-targets --features full-field,stochastic -- -D warnings

  no-std-check:
    name: no_std bare-metal build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Building --no-default-features on x86_64 proves only that the source
      # avoids std: std stays linkable, so a crate missing #![no_std] still
      # compiles. That gap let two defects ship in 0.7.0, one of them the
      # facade itself, which is the exact configuration the README documents.
      # A target with no std at all is the check that catches them.
      - name: Facade (alloc)
        run: cargo build -p cartan --no-default-features --features alloc --target thumbv7em-none-eabihf
      - name: Facade (alloc + homog)
        run: cargo build -p cartan --no-default-features --features alloc,homog --target thumbv7em-none-eabihf
      - name: cartan-core (bare, no alloc)
        run: cargo build -p cartan-core --no-default-features --target thumbv7em-none-eabihf
      - name: Alloc-tier crates
        run: |
          set -euo pipefail
          for c in cartan-manifolds cartan-optim cartan-geo cartan-homog; do
            echo "::group::$c"
            cargo build -p "$c" --no-default-features --features alloc --target thumbv7em-none-eabihf
            echo "::endgroup::"
          done

  feature-matrix:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      # Catches a feature that only compiles alongside another, which the
      # default and full builds both hide.
      - name: Each facade feature alone
        run: |
          set -euo pipefail
          for f in dec remesh stochastic homog full-field io maxwell; do
            echo "::group::$f"
            cargo build -p cartan --no-default-features --features "std,$f"
            echo "::endgroup::"
          done
      - name: Tier builds
        run: |
          set -euo pipefail
          cargo build -p cartan --no-default-features --features alloc
          cargo build -p cartan --no-default-features --features std
          cargo build -p cartan --features full
      - name: Guide doctests
        run: cargo test -p cartan --features full --doc

  msrv:
    name: MSRV (declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Must match workspace.package.rust-version in Cargo.toml. The real floor
      # is pinned by nalgebra 0.35 -> safe_arch/wide, all of which need 1.89.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace builds on the declared MSRV
        run: cargo check --workspace

  cartan-cuda:
    name: cartan-cuda (host side)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cartan-cuda
    steps:
      - uses: actions/checkout@v5
      # No toolchain action: cartan-cuda/rust-toolchain.toml pins the nightly
      # the codegen backend is built against, and rustup installs it, with
      # rustc-dev and llvm-tools, on the first cargo call in that directory.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cartan-cuda
      # cuda-bindings runs bindgen over the driver header in its build script,
      # so cuda.h must exist before anything in this job compiles, and the
      # runner image ships no CUDA at all. Only two packages are needed: the
      # driver dev package for `include/cuda.h` and `lib64/stubs/libcuda.so`,
      # and the runtime dev package for the headers cuda-oxide includes
      # alongside it. Together they are a few megabytes, against roughly three
      # gigabytes for the full toolkit, none of which this job would use.
      #
      # The stub exists for exactly this case. It resolves `-lcuda` at link
      # time on a machine with no driver, and its SONAME is `libcuda.so.1`, so
      # putting it on the runtime search path as well lets the test binaries
      # start: linking against it leaves a DT_NEEDED that the loader has to
      # satisfy before `main` runs, whether or not any test touches the driver.
      # Every entry point in the stub returns an error code rather than doing
      # the work, so a call that reached the driver by accident fails here
      # rather than passing quietly.
      #
      # The version is read from the repository rather than pinned here, so a
      # new CUDA release does not silently leave this job on an old header.
      - name: CUDA driver header and link stub
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          distro="ubuntu$(. /etc/os-release && echo "$VERSION_ID" | tr -d .)"
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/${distro}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq

          driver_pkg=$(apt-cache search --names-only '^cuda-driver-dev-[0-9]+-[0-9]+$' \
            | awk '{print $1}' | sort -V | tail -1)
          if [ -z "$driver_pkg" ]; then
            echo "No cuda-driver-dev package in the NVIDIA repository for $distro." >&2
            exit 1
          fi
          suffix=${driver_pkg#cuda-driver-dev-}
          sudo apt-get install -y --no-install-recommends \
            "$driver_pkg" "cuda-cudart-dev-${suffix}"

          root="/usr/local/cuda-${suffix/-/.}"
          test -f "$root/include/cuda.h"
          test -f "$root/lib64/stubs/libcuda.so"
          echo "CUDA_HOME=$root" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$root/lib64/stubs" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib64/stubs" >> "$GITHUB_ENV"
      # The runner has no GPU and no libNVVM, so nothing here compiles kernels
      # to PTX or launches one. What it does catch is the host half: the
      # batched API, its shape checking, and every signature the kernels are
      # called through, all of which drifted silently while the crate sat
      # outside CI.
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Formatting
        run: cargo fmt --check
