[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cartan"
requires-python = ">=3.10"
dependencies = ["numpy>=1.20"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dynamic = ["version"]
description = "Python bindings for the cartan Riemannian geometry library"
license = { text = "MIT" }

[project.optional-dependencies]
dec = ["scipy>=1.7"]
dev = ["pytest", "hypothesis", "scipy>=1.7"]

[tool.maturin]
features = []
manifest-path = "Cargo.toml"
module-name = "cartan"

[tool.pyrefly]
# Enables full Pyrefly type checking; run with `uvc`. See ~/.claude/rules/pyrefly.md
